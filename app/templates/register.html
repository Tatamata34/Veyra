{% extends "base.html" %}{% block content %}<div class="login-wrap"><div class="login-card"><span class="eyebrow">Veyra</span><h1>{{tr('Create your account')}}</h1><p class="muted">{{tr('Only username, email and password.')}}</p><form method="post" class="form-grid"><label>{{tr('Username')}}<input name="username" required></label><label>{{tr('Email')}}<input name="email" type="email" required></label><label>{{tr('Password')}}<input name="password" type="password" required></label><button class="nav-cta">{{tr('Register')}}</button></form><p class="muted">{{tr('Already have an account?')}} <a href="/login" style="color:var(--primary);font-weight:700">{{tr('Login')}}</a></p></div></div>{% endblock %}
